<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보건교사의 하루</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>

/* 레이아웃: 프로젝터 한 화면. 위 = 시계+하루 타임라인, 가운데 = 장면, 아래 = 이동 버튼 */
:root{
  --paper:#F4F6F3;
  --card:#FFFFFF;
  --ink:#1D2A31;
  --muted:#5C6B70;
  --line:#D3DCD8;
  --teal:#0F6767;
  --teal-soft:#E1EFEC;
  --alert:#C2412D;
  --alert-soft:#FBE7E2;
  --amber:#A86B12;
  --amber-soft:#FBF0DC;
  --ok:#2C7A4B;
  --ok-soft:#E2F2E8;
  --f-display:"Do Hyeon","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:clamp(15px,1.25vw,22px);line-height:1.5;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* 상단 */
header{display:flex;align-items:center;gap:clamp(12px,2vw,32px);padding:clamp(10px,1.4vh,18px) clamp(16px,2.5vw,40px);background:var(--ink);color:#fff}
.clock{display:flex;flex-direction:column;line-height:1}
.clock small{font-size:.7em;opacity:.7;letter-spacing:.05em}
.clock b{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,3.6vw,64px);font-variant-numeric:tabular-nums}
.timeline{flex:1;display:flex;gap:6px;align-items:stretch}
.stop{flex:1;border:0;background:rgba(255,255,255,.08);border-radius:6px;padding:8px 10px;text-align:left;color:#fff;display:flex;flex-direction:column;gap:2px;border-top:4px solid rgba(255,255,255,.2)}
.stop span{font-family:var(--f-display);font-size:1.15em;font-variant-numeric:tabular-nums}
.stop em{font-style:normal;font-size:.72em;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop.done{border-top-color:#7FC4B8}
.stop.now{background:rgba(255,255,255,.2);border-top-color:#fff}
.stop.urgent.now{border-top-color:#FF8A73}

main{flex:1;min-height:0;overflow:auto;padding:clamp(14px,2.4vh,32px) clamp(16px,2.5vw,40px)}
footer{display:flex;justify-content:space-between;align-items:center;padding:10px clamp(16px,2.5vw,40px);border-top:1px solid var(--line);background:var(--card);gap:12px}
footer .hint{color:var(--muted);font-size:.78em}
.nav{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 18px;font-weight:500}
.nav.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.nav:disabled{opacity:.35;cursor:default}

h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.2}

/* 시작 */
.intro{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(20px,3vw,48px);align-items:center;min-height:100%}
.intro h1{font-size:clamp(44px,5.4vw,96px);color:var(--teal)}
.intro .sub{font-size:1.15em;color:var(--muted);margin:.4em 0 1.2em}
.intro .lead{max-width:34em}
.start{margin-top:1.4em;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:.7em 1.6em;font-family:var(--f-display);font-size:1.4em}
.door{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,2vw,28px)}
.door h3{font-size:1.2em;margin-bottom:.6em;color:var(--muted)}
.sched{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sched li{display:grid;grid-template-columns:4.2em 1fr;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line)}
.sched li:last-child{border-bottom:0}
.sched b{font-family:var(--f-display);font-weight:400;font-size:1.2em;font-variant-numeric:tabular-nums;color:var(--teal)}
.sched li.urgent b{color:var(--alert)}

/* 단일 장면 */
.scene{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(16px,2.4vw,40px);max-width:1500px;margin:0 auto}
.visit{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--teal);border-radius:12px;padding:clamp(16px,2vw,30px);align-self:start}
.visit .meta{color:var(--muted);font-size:.85em;display:flex;gap:.8em;flex-wrap:wrap}
.visit h2{font-size:clamp(28px,2.8vw,48px);margin:.25em 0 .4em}
.visit p{margin:0 0 .9em}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.facts li{background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:.2em .8em;font-weight:500;font-size:.9em}
.facts li.flag{background:var(--alert-soft);color:var(--alert)}
.quote{border-left:3px solid var(--line);padding-left:.8em;color:var(--muted);font-style:italic}

.ask h3{font-size:clamp(22px,2vw,34px);margin-bottom:.6em}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:2.2em 1fr;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:.7em .9em;align-items:start}
.opt .k{font-family:var(--f-display);font-size:1.3em;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:var(--paper);line-height:1}
.opt:hover{border-color:var(--teal)}
.opt .why{display:none;margin-top:.35em;font-size:.88em}
.opt.wrong{border-color:var(--alert);background:var(--alert-soft)}
.opt.wrong .k{background:var(--alert);color:#fff}
.opt.wrong .why{display:block;color:var(--alert)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.faded{opacity:.55}
.reveal-btn{margin-top:12px;background:none;border:1px dashed var(--muted);border-radius:8px;padding:.4em 1em;color:var(--muted)}

.answer{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:clamp(14px,1.6vw,24px);animation:rise .35s ease-out}
.answer h4{margin:0 0 .4em;font-size:.85em;color:var(--muted);font-weight:500}
.answer ol{margin:0 0 .8em;padding-left:1.3em}
.answer li{margin:.15em 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--teal);color:var(--teal);border-radius:6px;padding:.1em .6em;font-size:.85em;font-weight:500}
.point{margin-top:.9em;padding:.6em .9em;background:var(--amber-soft);border-radius:8px;color:#6B4408;font-weight:500}

/* 12:20 동시 발생 */
.noon{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(12px,2vh,22px)}
.noon-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.noon-head h2{font-size:clamp(28px,2.8vw,48px)}
.noon-head h2 b{font-weight:400;color:var(--alert)}
.noon-head p{margin:0;color:var(--muted)}
.queue,.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.4vw,22px)}
.tile{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:.9em 1em;display:flex;flex-direction:column;gap:.3em;min-height:9.5em}
.tile:hover{border-color:var(--teal)}
.tile .tag{font-size:.8em;color:var(--muted)}
.tile h3{font-size:1.35em}
.tile p{margin:0;font-size:.92em}
.tile.used{visibility:hidden}
.slot{border:2px dashed var(--line);border-radius:12px;padding:.8em 1em;min-height:7.5em;display:flex;flex-direction:column;gap:.35em;background:transparent;text-align:left}
.slot .rank{font-family:var(--f-display);font-size:1.5em;color:var(--muted)}
.slot.filled{border-style:solid;border-color:var(--teal);background:var(--card)}
.slot.filled .rank{color:var(--teal)}
.slot .empty{color:var(--muted);font-size:.9em}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.act{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:.45em 1.1em;font-weight:500}
.act.go{background:var(--alert);border-color:var(--alert);color:#fff}
.rule{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.4vw,22px)}
.rule div{font-family:var(--f-display);font-size:clamp(20px,1.8vw,30px);text-align:center;padding:.35em;border-radius:8px;color:#fff;opacity:0;animation:light .4s ease-out forwards}
.rule div:nth-child(1){background:var(--alert);animation-delay:.1s}
.rule div:nth-child(2){background:var(--amber);animation-delay:.6s}
.rule div:nth-child(3){background:var(--teal);animation-delay:1.1s}
.result{background:var(--card);border-radius:12px;border:1px solid var(--line);border-top:6px solid var(--teal);padding:.9em 1em;display:flex;flex-direction:column;gap:.4em;animation:rise .35s ease-out both}
.result.r1{border-top-color:var(--alert)}
.result.r2{border-top-color:var(--amber);animation-delay:.5s}
.result.r3{animation-delay:1s}
.result h3{font-size:1.3em}
.result ol{margin:0;padding-left:1.2em;font-size:.92em}
.moved{font-size:.8em;color:var(--alert);font-weight:500}
.moved.same{color:var(--ok)}
.followup{background:var(--ink);color:#fff;border-radius:12px;padding:.9em 1.2em;display:flex;gap:1em;align-items:center;flex-wrap:wrap;animation:rise .35s ease-out 1.4s both}
.followup b{font-family:var(--f-display);font-weight:400;font-size:1.3em}
.followup span{opacity:.8;font-size:.9em}
.trap{color:var(--alert);font-weight:700}

/* 16:30 간호계획 */
.plan{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(16px,2.4vw,40px);max-width:1500px;margin:0 auto}
.plan-left{display:flex;flex-direction:column;gap:14px}
.data{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--amber);border-radius:12px;padding:.8em 1em}
.data .meta{color:var(--muted);font-size:.82em;margin-bottom:.5em}
.data small{font-weight:400;opacity:.8}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sheet-h{font-family:var(--f-display);font-size:1.15em;padding:.5em 1em;background:var(--teal-soft);color:var(--teal)}
.prow{display:grid;grid-template-columns:3.4em 1fr;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:.55em 1em;font-size:.92em;align-items:start}
.prow .pname{font-family:var(--f-display);font-size:1.15em;color:var(--muted)}
.prow .pfill i{color:var(--muted);font-style:normal;opacity:.6}
.prow.ok .pname{color:var(--teal)}
.prow.ok .pfill{animation:rise .35s ease-out}
.prow.cur{background:var(--amber-soft);box-shadow:inset 4px 0 0 var(--amber)}
.stepno{font-family:var(--f-display);color:var(--amber);font-size:1.1em;margin-bottom:.2em}
.alist{list-style:none;margin:0 0 .8em;padding:.6em .9em;background:var(--card);border:1px solid var(--line);border-radius:10px;display:grid;gap:.2em}
.note{margin-bottom:.6em}
.next-step{margin-top:.9em}
.log-sub{font-size:clamp(22px,2vw,34px);color:var(--teal);margin:1.4em 0 .6em}

/* 보건일지 */
.log{max-width:1500px;margin:0 auto}
.log-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.log-head h2{font-size:clamp(30px,3vw,52px);color:var(--teal)}
.log-head p{margin:0;color:var(--muted)}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:.88em}
th,td{padding:.55em .8em;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--teal-soft);color:var(--teal);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.t{font-family:var(--f-display);font-size:1.15em;font-variant-numeric:tabular-nums;white-space:nowrap}
td .chips{gap:4px}
.pr{display:inline-block;font-size:.8em;font-weight:700;border-radius:4px;padding:0 .4em;margin-right:.3em;color:#fff}
.pr1{background:var(--alert)}.pr2{background:var(--amber)}.pr3{background:var(--teal)}
.closing{margin-top:14px;font-weight:500}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes light{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
@media (max-width:820px){
  .intro,.scene,.plan{grid-template-columns:1fr}
  .queue,.slots,.rule{grid-template-columns:1fr}
  .stop em{display:none}
}

/* 실시간 투표 */
.opt{grid-template-columns:2.2em 1fr 4.2em;cursor:default;background:linear-gradient(90deg,var(--teal-soft) var(--p,0%),var(--card) var(--p,0%))}
.opt:hover{border-color:var(--line)}
.opt .cnt{font-family:var(--f-display);font-size:1.35em;text-align:right;font-variant-numeric:tabular-nums;align-self:center;white-space:nowrap}
.opt .cnt small{font-size:.6em;margin-left:1px}
.opt.right{background:linear-gradient(90deg,#CBE8D6 var(--p,0%),var(--ok-soft) var(--p,0%))}
.opt.wrong{background:linear-gradient(90deg,#F6CFC6 var(--p,0%),var(--alert-soft) var(--p,0%))}
.opt.wrong.dim{opacity:.75}
.resp{display:flex;gap:1em;align-items:center;flex-wrap:wrap;margin:.2em 0 .7em;color:var(--muted)}
.resp b{font-family:var(--f-display);font-weight:400;font-size:1.5em;color:var(--ink);font-variant-numeric:tabular-nums}
.go-reveal{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:.5em 1.3em;font-family:var(--f-display);font-size:1.15em;margin-top:12px}
.tile{cursor:default}
.tile:hover{border-color:var(--line)}
.tile .bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:auto}
.tile .bar i{display:block;height:100%;background:var(--alert);width:var(--p,0%);transition:width .3s}
.tile .first{font-size:.85em;color:var(--muted)}
.tile .first b{font-family:var(--f-display);font-weight:400;font-size:1.4em;color:var(--ink)}
.exact{font-weight:500}

/* 시작 화면 참여 */
.join{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,2vw,28px);display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.bans{display:flex;gap:8px}
.ban{border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:.25em .9em;font-family:var(--f-display);font-size:1.3em}
.ban.on{border-color:var(--teal);background:var(--teal);color:#fff}
#qr{background:#fff;padding:10px;border-radius:8px;line-height:0}
#qr img,#qr canvas{width:clamp(160px,17vw,280px)!important;height:auto!important}
.url{font-size:.85em;color:var(--muted);word-break:break-all}
.joined{font-family:var(--f-display);font-size:clamp(28px,2.6vw,44px);color:var(--teal)}
.mini{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.8em}
.mode{font-size:.75em;background:var(--amber-soft);color:#6B4408;border-radius:6px;padding:.2em .6em}
.sched.compact li{padding:4px 0;font-size:.92em}

/* 응답 결과 */
.stat{display:grid;grid-template-columns:7.5em 1fr 4em;gap:10px;align-items:center}
.stat .sb{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.stat .sb i{display:block;height:100%;background:var(--ok);width:var(--p,0%)}
td .wrongpick{color:var(--alert)}
</style>
</head>
<body>
<header>
  <div class="clock"><small id="roomlabel">○○중학교 보건실</small><b id="clock">08:30</b></div>
  <nav class="timeline" id="timeline" aria-label="하루 일정"></nav>
</header>
<main id="main"></main>
<footer>
  <button class="nav" id="prev">◀ 이전</button>
  <span class="hint">키보드: ← → 장면 이동 · Enter 정답 공개·다음 단계</span>
  <button class="nav primary" id="next">다음 ▶</button>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script>
const K=['A','B','C'];
const $=s=>document.querySelector(s);
const chips=a=>`<div class="chips">${a.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>`;
const today=(()=>{const d=new Date();return String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');})();
let savedBan='A'; try{ savedBan=localStorage.getItem('w9-ban')||'A'; }catch(e){}

const st={i:0, step:0, ban:savedBan, room:null, members:{}, answers:{}, revealed:{}, armed:false};
let unsubs=[];

function setRoom(ban){
  st.ban=ban; try{ localStorage.setItem('w9-ban',ban); }catch(e){}
  st.room='w9'+ban+today;
  unsubs.forEach(u=>u()); unsubs=[];
  const base='rooms/'+st.room;
  unsubs.push(Store.on(base+'/members', v=>{ st.members=v||{}; refresh(); }));
  unsubs.push(Store.on(base+'/answers', v=>{ st.answers=v||{}; refresh(); }));
  unsubs.push(Store.on(base+'/revealed', v=>{ st.revealed=v||{}; refresh(); }));
  pushState(); render();
}
function pushState(){ if(st.room) Store.set('rooms/'+st.room+'/state', {scene:S[st.i].id, step:st.step, t:Store.stamp()}); }
let refreshQueued=false;
function refresh(){ if(refreshQueued) return; refreshQueued=true; requestAnimationFrame(()=>{ refreshQueued=false; render(true); }); }

const nMembers=()=>Object.keys(st.members).length;
const ans=qid=>st.answers[qid]||{};
function counts(qid,n){ const c=Array(n).fill(0); Object.values(ans(qid)).forEach(v=>{ if(typeof v==='number'&&v>=0&&v<n) c[v]++; }); return c; }
const pct=(a,b)=>b?Math.round(a/b*100):0;
const studentURL=()=>{ const u=new URL('s.html', location.href); u.search='?r='+st.room; u.hash=''; return u.href; };

function renderTimeline(){
  $('#timeline').innerHTML=S.slice(1).map((s,j)=>{
    const idx=j+1, cls=[idx<st.i?'done':'', idx===st.i?'now':'', s.urgent?'urgent':''].join(' ');
    return `<button class="stop ${cls}" data-go="${idx}"><span>${s.time}</span><em>${esc(s.label)}</em></button>`;
  }).join('');
  $('#clock').textContent=S[st.i].time;
  $('#roomlabel').textContent=`○○중학교 보건실 · ${st.ban}반 · 접속 ${nMembers()}명`;
}

function intro(){
  return `<section class="intro">
    <div>
      <h1>보건교사의 하루</h1>
      <div class="sub">9주차 학교보건 · 오늘 나는 ○○중학교 보건교사</div>
      <p class="lead">시계가 움직이면 학생이 보건실 문을 두드립니다. 휴대폰으로 지금 가장 먼저 할 일을 골라 보세요. 점심시간에는 세 명이 한꺼번에 들어오고, 방과 후에는 학교 전체를 위한 간호계획을 세웁니다.</p>
      <ul class="sched compact">
        <li><b>08:40</b><span>등교 직후, 열이 나는 2학년</span></li>
        <li><b>10:00</b><span>체육시간에 다친 1학년</span></li>
        <li class="urgent"><b>12:20</b><span>점심시간, 세 명이 동시에</span></li>
        <li><b>15:30</b><span>또 배가 아프다는 1학년</span></li>
        <li><b>16:30</b><span>방과 후, 학교 전체를 위한 간호계획</span></li>
      </ul>
      <button class="start" data-go="1">하루 시작하기</button>
    </div>
    <div class="join">
      <div class="bans">${['A','B','C','D'].map(b=>`<button class="ban ${b===st.ban?'on':''}" data-ban="${b}">${b}반</button>`).join('')}</div>
      <div id="qr"></div>
      <div class="url">${esc(studentURL())}</div>
      <div class="joined">접속 ${nMembers()}명</div>
      ${Store.live?'':'<span class="mode">체험 모드: Firebase 설정 전이라 같은 브라우저의 탭끼리만 연결돼요</span>'}
      <button class="mini" data-clear>${st.armed?'한 번 더 누르면 이 반의 오늘 기록이 지워져요':'이 반 오늘 기록 지우고 새로 시작'}</button>
    </div>
  </section>`;
}

function optsHTML(qid, options){
  const c=counts(qid, options.length), total=c.reduce((a,b)=>a+b,0), rev=!!st.revealed[qid];
  const maxWrong=Math.max(...options.map((o,j)=>o.ok?-1:c[j]));
  return options.map((o,j)=>{
    let cls='';
    if(rev) cls=o.ok?'right':('wrong'+(c[j]===maxWrong&&c[j]>0?'':' dim'));
    return `<div class="opt ${cls}" style="--p:${pct(c[j],total)}%"><span class="k">${K[j]}</span><span>${esc(o.t)}${rev&&o.why?`<span class="why">${esc(o.why)}</span>`:''}</span><span class="cnt">${c[j]}<small>명</small></span></div>`;
  }).join('');
}
function respLine(qid){
  return `<div class="resp"><span>응답</span><b>${Object.keys(ans(qid)).length}</b><span>/ 접속 ${nMembers()}명</span></div>`;
}

function single(s){
  const rev=!!st.revealed[s.id];
  return `<section class="scene">
    <article class="visit">
      <div class="meta">${s.meta.map(esc).join('<span>·</span>')}</div>
      <h2>${esc(s.title)}</h2>
      <p>${esc(s.story)}</p>
      ${s.quote?`<p class="quote">${esc(s.quote)}</p>`:''}
      <ul class="facts">${s.facts.map(f=>`<li class="${f[1]?'flag':''}">${esc(f[0])}</li>`).join('')}</ul>
    </article>
    <div class="ask">
      <h3>지금 가장 먼저 할 일은?</h3>
      ${respLine(s.id)}
      <div class="opts">${optsHTML(s.id, s.options)}</div>
      ${rev?`<div class="answer">
        <h4>핵심 대응</h4>
        <ol>${s.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
        <h4>연결 개념</h4>${chips(s.concepts)}
        <div class="point">${esc(s.point)}</div>
      </div>`:`<button class="go-reveal" data-reveal>정답 공개</button>`}
    </div>
  </section>`;
}

function triageStats(s){
  const a=Object.values(ans(s.id)).filter(v=>typeof v==='string');
  const first={}; s.cards.forEach(c=>first[c.k]=0);
  let exact=0; a.forEach(v=>{ const o=v.split(','); if(first[o[0]]!==undefined) first[o[0]]++; if(v===s.order.join(',')) exact++; });
  return {n:a.length, first, exact};
}
function triage(s){
  const byK=Object.fromEntries(s.cards.map(c=>[c.k,c])), rev=!!st.revealed[s.id], t=triageStats(s);
  const head=`<div class="noon-head">
      <div><h2>12:20 점심시간, <b>세 명이 동시에</b> 들어왔다</h2>
      <p>누구를 먼저 볼까요? 휴대폰에서 카드를 1순위부터 차례로 누르세요.</p></div>
      ${respLine(s.id)}
    </div>`;
  if(!rev){
    return `<section class="noon">${head}
      <div class="queue">${s.cards.map(c=>`<div class="tile"><span class="tag">${esc(c.tag)}</span><h3>${esc(c.title)}</h3><p>${esc(c.body)}</p>
        <span class="first">1순위로 고른 학생 <b>${t.first[c.k]}</b>명</span><span class="bar" style="--p:${pct(t.first[c.k],t.n)}%"><i></i></span></div>`).join('')}</div>
      <div class="actions"><button class="go-reveal" data-reveal>정답 공개</button></div>
    </section>`;
  }
  return `<section class="noon">${head}
    <div class="rule"><div>생명 위협</div><div>집단 전파 차단</div><div>개인 불편</div></div>
    <div class="slots">${s.order.map((k,j)=>{
      const r=s.res[k];
      return `<div class="result r${j+1}"><span class="tag">${j+1}순위 · ${esc(byK[k].tag)}</span><h3>${esc(r.name)}</h3>
        <span class="moved ${j===0?'same':''}">1순위로 고른 학생 ${t.first[k]}명</span>
        <ol>${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${chips(r.concepts)}</div>`;
    }).join('')}</div>
    <p class="exact">세 장을 정답 순서대로 놓은 학생: ${t.exact}명 (${pct(t.exact,t.n)}%)</p>
    ${t.first.c4>0?`<p class="trap">수두를 1순위로 고른 학생 ${t.first.c4}명. 두 명이 함께 왔어도, 숨쉬기 힘든 한 명이 먼저입니다.</p>`:''}
    <div class="followup"><b>이 학생의 자가주사기, 어디 있는지 미리 알고 있었나요?</b><span>알레르기 학생 명단과 보관 위치를 미리 파악해 두는 것이 대응 속도를 가릅니다. (학교 응급환자 관리계획)</span></div>
  </section>`;
}

function plan(s){
  const n=st.step, step=s.steps[n], qid='plan'+n, rev=!!st.revealed[qid];
  const allDone=s.steps.every((_,j)=>st.revealed['plan'+j]);
  const sheet=s.steps.map((x,j)=>`<button class="prow ${j===n?'cur':''} ${st.revealed['plan'+j]?'ok':''}" data-pstep="${j}">
      <span class="pname">${x.name}</span><span class="pfill">${st.revealed['plan'+j]?esc(x.fill):'<i>아직 비어 있음</i>'}</span></button>`).join('');
  return `<section class="plan">
    <div class="plan-left">
      <div class="data">
        <div class="meta">카드 7 · 방과 후 · 올해 건강검사·건강행태 조사 결과 (가상 자료)</div>
        <ul class="facts">${s.data.map(d=>`<li class="flag">${esc(d[0])}${d[1]?` <small>(${esc(d[1])})</small>`:''}</li>`).join('')}</ul>
      </div>
      <div class="sheet"><div class="sheet-h">2학년 비만 예방 간호계획서</div>${sheet}</div>
    </div>
    <div class="ask">
      <div class="stepno">${n+1} / 5 · ${step.name}</div>
      <h3>${esc(step.q)}</h3>
      ${step.list?`<ul class="alist">${step.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
      ${respLine(qid)}
      <div class="opts">${optsHTML(qid, step.options)}</div>
      ${rev?`<div class="answer"><div class="note">${esc(step.note)}</div>${chips(step.concepts)}
        ${n<4?`<button class="act go next-step" data-pnext>다음 단계: ${s.steps[n+1].name} ▶</button>`:''}</div>`
        :`<button class="go-reveal" data-reveal>정답 공개</button>`}
      ${allDone?`<div class="point">오전에는 학생 한 명, 방과 후에는 학교 전체가 대상입니다. 학교간호과정은 지역사회간호과정과 같은 틀이에요.</div>`:''}
    </div>
  </section>`;
}

function resultRows(){
  return allQs().map(q=>{
    let n, ok, wrong='';
    if(q.kind==='triage'){ const t=triageStats(q.scene); n=t.n; ok=t.exact;
      const wf=Object.entries(t.first).filter(([k])=>k!==q.scene.order[0]).sort((a,b)=>b[1]-a[1])[0];
      if(wf&&wf[1]>0) wrong=`1순위 ${q.scene.res[wf[0]].name} (${wf[1]}명)`;
    } else { const c=counts(q.qid,q.options.length); n=c.reduce((a,b)=>a+b,0);
      const ci=q.options.findIndex(o=>o.ok); ok=c[ci];
      const w=c.map((v,j)=>[v,j]).filter(([v,j])=>j!==ci).sort((a,b)=>b[0]-a[0])[0];
      if(w&&w[0]>0) wrong=`${K[w[1]]}. ${q.options[w[1]].t} (${w[0]}명)`;
    }
    const label=q.kind==='triage'?'12:20 우선순위':(q.step!==undefined?`16:30 ${q.name}`:`${q.name} ${q.scene.title}`);
    return `<tr><td>${esc(label)}</td><td>${n}명</td><td><div class="stat"><span>${ok}명 정답</span><span class="sb" style="--p:${pct(ok,n)}%"><i></i></span><b>${pct(ok,n)}%</b></div></td><td class="wrongpick">${esc(wrong||'-')}</td></tr>`;
  }).join('');
}

function endLog(){
  const rows=[];
  S.forEach(s=>{
    if(s.type==='single') rows.push({t:s.time, ...s.log, c:s.concepts});
    if(s.type==='triage') s.log.forEach((l,j)=>rows.push({t:j===0?s.time:'', pr:j+1, ...l, c:s.res[l.k].concepts}));
  });
  return `<section class="log">
    <div class="log-head"><div><h2>오늘의 보건일지</h2><p>○○중학교 보건실 · ${st.ban}반 · 하루 동안 만난 학생 6명</p></div></div>
    <div class="tablewrap"><table>
      <thead><tr><th>시각</th><th>학생·호소</th><th>판단</th><th>조치</th><th>연결 개념</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td class="t">${r.t}</td><td>${r.pr?`<span class="pr pr${r.pr}">${r.pr}순위</span>`:''}${esc(r.who)}</td><td>${esc(r.judge)}</td><td>${esc(r.act)}</td><td>${chips(r.c)}</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="closing">우선순위 원칙: 생명 위협 → 집단 전파 차단 → 개인 불편</p>
    <h3 class="log-sub">방과 후 · 2학년 비만 예방 간호계획서</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>단계</th><th>내용</th><th>연결 개념</th></tr></thead>
      <tbody>${S.find(x=>x.type==='plan').steps.map(x=>`<tr><td class="t">${x.name}</td><td>${esc(x.fill)}</td><td>${chips(x.concepts)}</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="closing">오전에는 학생 한 명, 방과 후에는 학교 전체가 대상입니다.</p>
    <h3 class="log-sub">${st.ban}반 응답 결과</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>문제</th><th>응답</th><th>정답</th><th>가장 많이 고른 오답</th></tr></thead>
      <tbody>${resultRows()}</tbody>
    </table></div>
  </section>`;
}

function render(soft){
  const s=S[st.i];
  if(soft && s.id==='intro' && $('.joined')){ $('.joined').textContent=`접속 ${nMembers()}명`; renderTimeline(); return; }
  const y=$('#main').scrollTop;
  $('#main').innerHTML = s.id==='intro'?intro(): s.id==='end'?endLog(): s.type==='single'?single(s): s.type==='plan'?plan(s): triage(s);
  if(soft) $('#main').scrollTop=y; else $('#main').scrollTop=0;
  if(s.id==='intro' && window.QRCode){ $('#qr').innerHTML=''; new QRCode($('#qr'),{text:studentURL(),width:280,height:280,correctLevel:QRCode.CorrectLevel.M}); }
  if(st.scrollAnswer && $('.answer, .followup')){ st.scrollAnswer=false; $('.answer, .followup').scrollIntoView({block:'nearest'}); }
  renderTimeline();
  $('#prev').disabled=st.i===0;
  $('#next').disabled=st.i===S.length-1;
  $('#next').textContent=st.i===S.length-2?'보건일지 ▶':'다음 ▶';
}

function go(i){ st.i=Math.max(0,Math.min(S.length-1,i)); st.armed=false; pushState(); render(); }
function curQid(){ const s=S[st.i]; return (s.type==='single'||s.type==='triage')?s.id:(s.type==='plan'?'plan'+st.step:null); }
function reveal(){ const q=curQid(); if(q&&!st.revealed[q]){ st.scrollAnswer=true; } if(q&&!st.revealed[q]) Store.set('rooms/'+st.room+'/revealed/'+q, true); }
function pnext(){ if(S[st.i].type==='plan' && st.revealed['plan'+st.step] && st.step<4){ st.step++; pushState(); render(); } }

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.go) return go(+t.dataset.go);
  if(t.dataset.ban) return setRoom(t.dataset.ban);
  if('reveal' in t.dataset) return reveal();
  if('pnext' in t.dataset) return pnext();
  if(t.dataset.pstep){ st.step=+t.dataset.pstep; pushState(); return render(); }
  if('clear' in t.dataset){
    if(!st.armed){ st.armed=true; return render(); }
    st.armed=false; st.step=0;
    Store.remove('rooms/'+st.room).then(()=>pushState()); return;
  }
});
$('#prev').onclick=()=>go(st.i-1);
$('#next').onclick=()=>go(st.i+1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(st.i+1);}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(st.i-1);}
  else if(e.key==='Enter'){ e.preventDefault(); const q=curQid(); if(q&&!st.revealed[q]) reveal(); else pnext(); }
});
setRoom(st.ban);
</script>
</body>
</html>
